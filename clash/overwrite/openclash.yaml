#================================================
#               OpenClash 配置文件
#================================================

#--------------------------------
# OpenClash 覆写设置
#--------------------------------
# ruby_edit "$CONFIG_FILE" "['keep-alive-interval']" "1800"
# ruby_edit "$CONFIG_FILE" "['keep-alive-idle']" "600"
# ruby_edit "$CONFIG_FILE" "['external-ui']" "\"/etc/openclash/ui\""
# ruby_edit "$CONFIG_FILE" "['external-ui-name']" "\"zashboard\""
# ruby_edit "$CONFIG_FILE" "['external-ui-url']" "\"https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip\""

#================================
# 基础网络配置
#================================
port: 7890                    # HTTP 代理端口
socks-port: 7891              # SOCKS5 代理端口
redir-port: 7892              # 透明代理端口
mixed-port: 7893              # 混合代理端口
tproxy-port: 7895             # TProxy 端口

allow-lan: true               # 允许局域网连接
mode: rule                    # 运行模式
log-level: warning            # 日志级别
ipv6: false                   # IPv6

#================================
# 高级功能配置
#================================
keep-alive-interval: 1800
keep-alive-idle: 600
# find-process-mode: strict   # 可选项："off" | strict | awlays

external-controller: 127.0.0.1:9090
# external-ui: "/etc/openclash/ui"
# external-ui-name: zashboard
# external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip

profile:
  store-selected: true
  store-fake-ip: true

unified-delay: true
tcp-concurrent: true
global-client-fingerprint: random

geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24  #更新间隔，单位为小时
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat"
  # mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  # asn: "https://testingcf.jsdelivr.net/gh/xishang0128/geoip@releases/download/latest/GeoLite2-ASN.mmdb"

global-ua: FFFFFFFFF

#================================
# Tun 配置
#================================
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  device: utun-mihomo
  strict-route: true
  endpoint-independent-nat: true

#================================
# DNS 配置
#================================
bootstrap_dns_servers: &bootstrap_dns_servers
  - quic://223.5.5.5
  - quic://223.6.6.6
  - tls://223.5.5.5
  - tls://223.6.6.6
  - https://223.5.5.5/dns-query
  - https://223.6.6.6/dns-query
global_dns_servers: &global_dns_servers
  - https://mozilla.cloudflare-dns.com/dns-query#DNS&h3=true
  - https://cloudflare-dns.com/dns-query#DNS
  - https://one.one.one.one/dns-query#DNS
  - tls://one.one.one.one#DNS
  - tls://1dot1dot1dot1.cloudflare-dns.com#DNS
  - https://dns.google/dns-query#DNS
  - tls://dns.google#DNS
cn_dns_servers: &cn_dns_servers
  - quic://dns.alidns.com
  - https://dns.alidns.com/dns-query#h3=true
  - tls://dns.alidns.com
  - https://doh.pub/dns-query
  - tls://dot.pub
dns:
  enable: true
  ipv6: false
  # use-hosts: true
  # use-system-hosts: true
  enhanced-mode: redir-host
  # prefer-h3: true
  respect-rules: true
  default-nameserver: *bootstrap_dns_servers
  proxy-server-nameserver: *cn_dns_servers
  direct-nameserver: *cn_dns_servers
  nameserver: *global_dns_servers

#================================
# 流量嗅探配置
#================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    QUIC:
      ports: [443]
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
  force-domain: ["+.netflix.com", "+.nflxvideo.net", "+.amazonaws.com", "+.media.dssott.com"]
  skip-domain: ["+.apple.com", "Mijia Cloud", "dlg.io.mi.com", "+.oray.com", "+.sunlogin.net", "+.push.apple.com"]

#================================
# 代理提供商配置
#================================
# 代理提供商通用模板
providers_template: &providers_template
  type: http
  interval: 18000
  header:
    User-Agent:
    - "mihomo/1.18.3"
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204

#================================
# 代理组配置模板与锚点
#================================
# --- 定义两种核心选择器模板 ---
proxy_groups: &proxy_groups
  type: select
  proxies: [ '🔰选择节点', 'DIRECT', '♻️自动选择',
    '🇭🇰香港-自动',
    '🇹🇼台湾-自动',
    '🇯🇵日本-自动',
    '🇸🇬新加坡-自动',
    '🇺🇸美国-自动',
    '🇪🇺欧洲-自动',
    '🇹🇷土耳其-自动' ]
  include-all: true

direct_groups: &direct_groups
  type: select
  proxies: [ 'DIRECT', '🔰选择节点', '♻️自动选择',
    '🇭🇰香港-自动',
    '🇹🇼台湾-自动',
    '🇯🇵日本-自动',
    '🇸🇬新加坡-自动',
    '🇺🇸美国-自动',
    '🇪🇺欧洲-自动',
    '🇹🇷土耳其-自动' ]
  include-all: true

#-------------------------------- 锚点定义 --------------------------------#
hk_filter: &hk_filter '(?i)港|HK|Hong Kong|HongKong|hongkong|深港'
tw_filter: &tw_filter '(?i)台|新北|彰化|TW|Taiwan'
jp_filter: &jp_filter '(?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵'
sg_filter: &sg_filter '(?i)新加坡|坡|狮城|SG|Singapore'
us_filter: &us_filter '(?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates'
eu_filter: &eu_filter '(?i)欧洲|EU|Europe|英国|UK|法国|France|德国|Germany|荷兰|Netherlands|意大利|Italy|西班牙|Spain|葡萄牙|Portugal'
tr_filter: &tr_filter '(?i)土耳其|Turkey|Türkiye'

# --- 自动选择模板 ---
auto_select: &auto_select
  type: url-test
  interval: 300
  tolerance: 50
  url: https://cp.cloudflare.com
  timeout: 5000
  max-failed-times: 5

#================================
# 代理组定义
#================================
proxy-groups:
#-------------------------------- 核心策略分组 --------------------------------#
  - name: "🔰选择节点"
    type: select
    proxies: [ 'DIRECT', '♻️自动选择',
      '🇭🇰香港-自动',
      '🇹🇼台湾-自动',
      '🇯🇵日本-自动',
      '🇸🇬新加坡-自动',
      '🇺🇸美国-自动',
      '🇪🇺欧洲-自动',
      '🇹🇷土耳其-自动' ]
    include-all: true
  - name: "📟Google"
    <<: *proxy_groups
  - name: "🗄️Microsoft"
    <<: *proxy_groups
  - name: "🍎Apple"
    <<: *proxy_groups
  - name: "📁国外云盘"
    <<: *proxy_groups
  - name: "🤖AI服务"
    <<: *proxy_groups
  - name: "🎮游戏平台"
    <<: *proxy_groups
  - name: "📲社交媒体"
    <<: *proxy_groups
  - name: "📕学术网站"
    <<: *direct_groups
  - name: "💻开发平台"
    <<: *proxy_groups
  - name: "🌩️Cloudflare"
    <<: *proxy_groups
  - name: "🇨🇳国内直连"
    <<: *direct_groups
    
  # - name: "🛑拦截广告"
  #   type: select
  #   proxies: ['REJECT', 'DIRECT', '🔰选择节点', '♻️自动选择']
  - name: "🐟漏网之鱼"
    <<: *proxy_groups
#-------------------------------- 隐藏策略分组 --------------------------------#
# --- 自动选择 ---
  - name: ♻️自动选择
    <<: *auto_select
    include-all: true
    hidden: true
  - name: DNS
    type: select
    proxies: ['🔰选择节点']
    hidden: true
#-------------------------------- 地区策略分组 --------------------------------#
# --- 香港 ---
  - name: 🇭🇰香港-自动
    <<: *auto_select
    include-all: true
    filter: *hk_filter
    hidden: true
# --- 台湾 ---
  - name: 🇹🇼台湾-自动
    <<: *auto_select
    include-all: true
    filter: *tw_filter
    hidden: true
# --- 日本 ---
  - name: 🇯🇵日本-自动
    <<: *auto_select
    include-all: true
    filter: *jp_filter
    hidden: true
# --- 新加坡 ---
  - name: 🇸🇬新加坡-自动
    <<: *auto_select
    include-all: true
    filter: *sg_filter
    hidden: true
# --- 美国 ---
  - name: 🇺🇸美国-自动
    <<: *auto_select
    include-all: true
    filter: *us_filter
    hidden: true
# --- 欧洲 (新增) ---
  - name: 🇪🇺欧洲-自动
    <<: *auto_select
    include-all: true
    filter: *eu_filter
    hidden: true
# --- 土耳其 ---
  - name: 🇹🇷土耳其-自动
    <<: *auto_select
    include-all: true
    filter: *tr_filter
    hidden: true

#================================
# 路由规则
#================================
rules:
  # --------------------自定义规则--------------------
  - DST-PORT,123,DIRECT                          # 配合 nftables 或 iptables 把 ntp 流量重定向到路由器，使局域网内的时间一致
  - DST-PORT,22,DIRECT
  - RULE-SET,my_rules_proxy,🔰选择节点
  - RULE-SET,my_rules_direct,🇨🇳国内直连
  # --------------------自定义私有地址和局域网--------------------

  # --------------------局域网和私有地址直连--------------------
  - RULE-SET,private,🇨🇳国内直连
  - RULE-SET,lancidr,🇨🇳国内直连
  # --------------------国外主要平台--------------------
  # 学术期刊
  - RULE-SET,my_scholar_proxy,🔰选择节点
  - RULE-SET,my_scholar_direct,📕学术网站
  - RULE-SET,GlobalScholar,📕学术网站
  # 各大国外云盘
  - RULE-SET,Dropbox,📁国外云盘
  - RULE-SET,Dubox,📁国外云盘
  - RULE-SET,TeraBox,📁国外云盘
  - RULE-SET,PikPak,📁国外云盘
  - RULE-SET,MEGA,📁国外云盘
  # 游戏平台
  - RULE-SET,category-games@cn,🇨🇳国内直连
  - RULE-SET,category-games,🎮游戏平台
  # 开发者工具和平台
  - RULE-SET,category-dev@cn,🇨🇳国内直连
  - RULE-SET,category-dev,💻开发平台
  # Google
  - RULE-SET,GoogleDrive,📁国外云盘
  - RULE-SET,google,📟Google
  - RULE-SET,google_ip,📟Google,no-resolve
  # Microsoft
  - RULE-SET,OneDrive,📁国外云盘
  - RULE-SET,microsoft,🗄️Microsoft
  # Apple
  - RULE-SET,icloud@cn,🇨🇳国内直连
  - RULE-SET,icloud,📁国外云盘
  - RULE-SET,apple@cn,🇨🇳国内直连
  - RULE-SET,apple,🍎Apple
  - RULE-SET,apple_ip,🍎Apple,no-resolve
  # AI 服务
  - RULE-SET,category-ai-!cn,🤖AI服务
  # 社交媒体
  - RULE-SET,category-entertainment@cn,🇨🇳国内直连
  - RULE-SET,category-media@cn,🇨🇳国内直连
  - RULE-SET,category-communication,📲社交媒体
  - RULE-SET,category-entertainment,📲社交媒体
  - RULE-SET,category-forums,📲社交媒体
  - RULE-SET,category-media,📲社交媒体
  - RULE-SET,category-social-media-!cn,📲社交媒体
  - RULE-SET,telegram,📲社交媒体,no-resolve
  # 其他平台
  - RULE-SET,cloudflare,🌩️Cloudflare
  - RULE-SET,cloudflare_ip,🌩️Cloudflare,no-resolve
  # --------------------国内网站--------------------
  - RULE-SET,cn,🇨🇳国内直连
  - RULE-SET,cn_ip,🇨🇳国内直连,no-resolve
  # --------------------其他流量和最终规则--------------------
  - MATCH,🐟漏网之鱼

